name: Pruebas contra Producción (Render)

# Ejecuta las pruebas de API contra la URL pública desplegada en Render.
# Configura la variable del repositorio PROD_URL (Settings > Secrets and variables > Actions > Variables).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *' # todos los días 08:00 hora Perú

jobs:
  produccion:
    name: Cypress vs producción
    runs-on: ubuntu-latest
    if: ${{ vars.PROD_URL != '' }}
    env:
      BASE_URL: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Despertar el servicio (plan gratis de Render)
        run: |
          for i in $(seq 1 12); do
            curl -sf "$BASE_URL/api/health" && exit 0
            echo "Esperando a Render... ($i)"; sleep 10
          done
          exit 1

      - run: npm ci

      - name: Ejecutar pruebas de API en producción
        run: npm run test:prod
