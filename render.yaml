# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tasklab-api-testing
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    # Solo despliega cuando las pruebas de GitHub Actions pasan
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22
